x-go-service: &go-service
  image: avito-kitchen:local
  build:
    context: .
    dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avito
      POSTGRES_PASSWORD: avito
      POSTGRES_DB: avito_kitchen
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avito -d avito_kitchen"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:9092,PLAINTEXT_HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kitchen-api:
    <<: *go-service
    command: ["kitchen-api"]
    environment:
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9080"
      CATALOG_GRPC_TARGET: dns:///catalog-service:9081
      ORDER_GRPC_TARGET: dns:///order-service:9082
    ports:
      - "8080:8080"
    depends_on:
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog-service:
    <<: *go-service
    command: ["catalog-service"]
    environment:
      HTTP_ADDR: ":8081"
      GRPC_ADDR: ":9081"
      DATABASE_URL: postgres://avito:avito@postgres:5432/avito_kitchen?sslmode=disable
    ports:
      - "8081:8081"
      - "9081:9081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  order-service:
    <<: *go-service
    command: ["order-service"]
    environment:
      HTTP_ADDR: ":8082"
      GRPC_ADDR: ":9082"
      CATALOG_GRPC_TARGET: dns:///catalog-service:9081
      DATABASE_URL: postgres://avito:avito@postgres:5432/avito_kitchen?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      ORDER_EVENTS_TOPIC: orders.events.v1
      PARTNER_EVENTS_TOPIC: partner.events.v1
      PARTNER_EVENTS_CONSUMER_GROUP: order-service-partner-events-v1
      KAFKA_CONSUMER_RETRY_DELAY: 1s
      OUTBOX_RELAY_BATCH_SIZE: "50"
      OUTBOX_RELAY_POLL_INTERVAL: 1s
      OUTBOX_RELAY_LOCK_TTL: 30s
      OUTBOX_RELAY_RETRY_DELAY: 5s
    ports:
      - "8082:8082"
      - "9082:9082"
    depends_on:
      catalog-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  partner-service:
    <<: *go-service
    command: ["partner-service"]
    environment:
      HTTP_ADDR: ":8083"
      GRPC_ADDR: ":9083"
      DATABASE_URL: postgres://avito:avito@postgres:5432/avito_kitchen?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      ORDER_EVENTS_TOPIC: orders.events.v1
      ORDER_EVENTS_CONSUMER_GROUP: partner-service-orders-v1
      PARTNER_EVENTS_TOPIC: partner.events.v1
      KAFKA_CONSUMER_RETRY_DELAY: 1s
      PARTNER_DISPATCH_BATCH_SIZE: "20"
      PARTNER_DISPATCH_POLL_INTERVAL: 1s
      PARTNER_DISPATCH_LOCK_TTL: 30s
      PARTNER_DISPATCH_RETRY_DELAY: 5s
      PARTNER_DISPATCH_MAX_ATTEMPTS: "5"
      PARTNER_HTTP_TIMEOUT: 3s
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  sample-restaurant-service:
    <<: *go-service
    command: ["sample-restaurant-service"]
    environment:
      HTTP_ADDR: ":8084"
      GRPC_ADDR: ":9084"
      PARTNER_CALLBACK_URL: http://partner-service:8083/callbacks/order-status
      PARTNER_CALLBACK_TOKEN: development-only-secret
      PARTNER_CALLBACK_TIMEOUT: 3s
      SAMPLE_RESTAURANT_OPERATOR_TOKEN: development-only-operator-secret
    ports:
      - "8084:8084"
    depends_on:
      partner-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kafka-data:
